services:
  quack-aloud:
    build: .
    image: quack-aloud:local
    ports:
      - "8787:8787"
    env_file:
      - .env            # ANTHROPIC_API_KEY and any overrides
    environment:
      DATA_DIR: /data
    volumes:
      # Same folder the dev server uses, so data/projects/<id>.json is shared with
      # `npm run dev`, Claude Code, and Antigravity (the agent routes keep working).
      - ./data:/data
    restart: unless-stopped
