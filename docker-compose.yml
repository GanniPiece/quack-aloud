services:
  quack-aloud:
    build: .
    image: quack-aloud:local
    ports:
      - "8787:8787"
    env_file:
      - .env            # PROVIDER, ANTHROPIC_API_KEY / OPENAI_API_KEY, and overrides
    environment:
      DATA_DIR: /data
      # APP_EMAIL: you@example.com   # with APP_PASSWORD: seeds the owner account; otherwise the first
      # APP_PASSWORD: change-me      # visit asks for email + password. Accounts live in ./data/users.json
    volumes:
      # Same data/projects/<pid>/<cid>.json files as npm run dev and the
      # Claude Code, Codex, and Antigravity agent routes.
      - ./data:/data
    restart: unless-stopped
