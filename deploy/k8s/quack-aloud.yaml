# Minimal single-replica deployment. State is files on a volume, so keep replicas at 1
# and use a ReadWriteOnce volume. Create the secret first:
#   kubectl create secret generic quack-aloud --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=APP_EMAIL=you@example.com --from-literal=APP_PASSWORD=...
# For OpenAI instead, use --from-literal=OPENAI_API_KEY=... and set PROVIDER=openai below.
# Add --from-literal=MCP_TOKEN=... to pin the MCP bearer token (otherwise one is generated on the volume).
# APP_EMAIL + APP_PASSWORD seed the owner account on first start (or leave them out and create
# it on the first visit; accounts are kept on the volume). Set TRUST_PROXY=1 when an Ingress
# terminates TLS in front of the pod.
# Put the app behind an Ingress with authentication before exposing it: the API key
# pays for every message anyone sends.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quack-aloud-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quack-aloud
spec:
  replicas: 1
  strategy:
    type: Recreate          # the volume is RWO; never run two pods against it
  selector:
    matchLabels:
      app: quack-aloud
  template:
    metadata:
      labels:
        app: quack-aloud
    spec:
      containers:
        - name: app
          image: ghcr.io/gannipiece/quack-aloud:latest   # or your registry
          ports:
            - containerPort: 8787
          env:
            - name: PROVIDER
              value: claude         # or openai; the matching key must be in the Secret
            - name: DATA_DIR
              value: /data
            - name: API_PORT
              value: "8787"
            - name: CLAUDE_MODEL
              value: claude-opus-5
            - name: CLAUDE_EFFORT
              value: medium
            - name: OPENAI_MODEL
              value: gpt-5.4-mini
            - name: OPENAI_EFFORT
              value: medium
            - name: TRUST_PROXY
              value: "1"
          envFrom:
            - secretRef:
                name: quack-aloud
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quack-aloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: quack-aloud
spec:
  selector:
    app: quack-aloud
  ports:
    - port: 80
      targetPort: 8787
